# Stage 12: proves extensibility from outside zukomp.
#
# zukomp has two downstream consumption modes and a fixture package for each,
# both .Rbuildignore'd, so nothing else builds them; this workflow is the only
# thing that does.
#
#   tools/zukomptest  the table mode, as zuhttp will use it: Imports +
#                     LinkingTo, an importFrom in NAMESPACE, and a codec of
#                     its own registered through the published C ABI.
#   tools/zukomplink  the archive mode, as zuxlsx already uses it: LinkingTo
#                     alone, the installed libzukomp.a linked statically by
#                     the fixture's own ./configure, and zukomp's namespace
#                     never loaded. Driven by tools/check-linking.sh, which
#                     also audits the wiring the package itself cannot see.
#
# paths-ignore matches native-checks.yaml: these jobs compile the package and
# run code, so nothing they can observe lives in a .md file, a pkgdown article
# or .agents/. GitHub applies it only when *every* changed file matches, so a
# commit touching both prose and a source file still runs.
#
# `!tests/**` re-includes what `**.md` would otherwise swallow: testthat
# snapshots are .md files, and a commit that changes only a snapshot is
# exactly when the suite needs to run. Order matters -- the negation has to
# come after the pattern it undoes.
on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - '**.md'
      - '!tests/**'
      - 'vignettes/**'
      - '_pkgdown.yml'
      - '.agents/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '!tests/**'
      - 'vignettes/**'
      - '_pkgdown.yml'
      - '.agents/**'
      - 'docs/**'

name: consumer.yaml

permissions: read-all

# A new push to a pull request cancels the run it supersedes. Pushes to main
# (and scheduled runs) get a group of their own via run_id, so every merge is
# checked and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  consumer:
    runs-on: ${{ matrix.os }}
    name: external codec registration (${{ matrix.os }})
    # `R CMD INSTALL .` is a shell command line, not a PowerShell one: pwsh
    # parses CMD and INSTALL as arguments to R and fails before R runs.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check

      - name: install zukomp
        run: R CMD INSTALL .

      - name: install the consumer
        run: R CMD INSTALL tools/zukomptest

      # Via a file, not `Rscript -e`: on Windows only the first line of a
      # multi-line -e argument reaches R, which then halts on an incomplete
      # expression instead of running the tests.
      - name: run the consumer's tests
        run: |
          cat > run-consumer-tests.R <<'R'
          results <- as.data.frame(testthat::test_local(
              "tools/zukomptest", reporter = "summary"))
          # A zero-row result is a green job that proved nothing: any() over
          # an empty vector is FALSE. If test_local() discovers no files --
          # a rename, an .Rbuildignore change, a load failure -- that must
          # fail, not pass quietly.
          if (nrow(results) == 0L || sum(results$passed) == 0L) {
            stop("no consumer tests ran")
          }
          quit(status = as.integer(any(results$failed > 0 | results$error)))
          R
          Rscript run-consumer-tests.R

      # The other consumer shape: tools/zukomplink, which links the installed
      # libzukomp.a for the ZIP reader that zukomp.so deliberately does not
      # contain. The script installs it through its own ./configure, audits
      # that it declares no run-time dependency, and finally moves the
      # installed zukomp away to prove it needs none.
      - name: link the static archive and read a ZIP
        run: ./tools/check-linking.sh
