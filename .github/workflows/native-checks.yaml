# Native-code checks, from the shared reusable workflows.
#
# These replace a hand-rolled memcheck.yaml. Two of them -- lto and
# gctorture -- were not in it and are worth more here than what they
# replaced: LTO catches type mismatches between translation units, which
# matters for a package whose C ABI is split across a dozen files plus a
# vendored library; and gctorture is a far better test of PROTECT discipline
# than rchk alone, since it provokes real collections instead of reasoning
# about them statically.
on:
  push:
    branches: [main, master, develop]
  pull_request:
  schedule:
    - cron: "23 4 * * *"

name: native-checks

permissions: read-all

jobs:
  # ZUKOMP_SLOW_TESTS is the whole reason this repo used to carry its own
  # copy of this job: without it only the sampled CRAN subset of the
  # truncation and corruption sweeps runs, and those sweeps are precisely
  # where a memory-safety bug in this package would live.
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1
    with:
      env: |
        ZUKOMP_SLOW_TESTS=true
      # ASan in the R-hub containers, where R itself is instrumented. Not
      # redundant with fuzz/build.sh --standalone: that covers the pure C
      # core linked into a real executable, this covers the R glue -- the
      # external pointers, the PROTECT discipline and the longjmp paths no
      # fuzz target can reach.
      asan: true
      timeout-minutes: 90

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1
    with:
      # Valgrind runs the code on a synthetic CPU, and this suite is
      # sweep-heavy.
      timeout-minutes: 90

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@v1

  # Fail on findings: the package is at zero now, so the next one is a
  # regression, and a warning nobody opens is not how you learn about it.
  # The two it did have were unprotected SEXPs held across
  # zu_encoder_free() -- a vtable function pointer, so rchk must assume it
  # allocates, and it is right to.
  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1
    with:
      fail-on-findings: true
