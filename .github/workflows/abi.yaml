# Guards the public C ABI surface.
#
# design 8 requires inst/include/zukomp.h to compile standalone as C99
# against only <stddef.h> and <stdint.h>, mentioning neither R nor any
# vendored codec. That property is invisible to R CMD check -- the header is
# only ever compiled as part of a translation unit that already includes R
# headers -- so it is checked here instead.
on:
  push:
    branches: [main, master, develop]
  pull_request:

name: abi.yaml

permissions: read-all

jobs:
  standalone-header:
    runs-on: ${{ matrix.os }}
    name: zukomp.h standalone (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: compiles as C99 with no R and no codec headers
        run: |
          printf '#include <zukomp.h>\nint main(void){return 0;}\n' > probe.c
          cc -std=c99 -Wall -Wextra -Wpedantic -Werror \
             -Iinst/include -c probe.c -o /dev/null
          echo "ok  C99"

      - name: compiles as C++ through the extern \"C\" wrapper
        run: |
          printf '#include <zukomp.h>\nint main(){return 0;}\n' > probe.cpp
          c++ -std=c++11 -Wall -Wextra -Werror \
              -Iinst/include -c probe.cpp -o /dev/null
          echo "ok  C++"

      # Comments are stripped first, matching tests/testthat/helper-abi.R:
      # the rule is about what the header *declares*. A comment explaining
      # that no miniz type appears here is fine; a declaration is not.
      - name: declares nothing from R or a vendored codec
        run: |
          python3 - <<'PY'
          import re, sys
          src = open("inst/include/zukomp.h", encoding="utf-8").read()
          code = re.sub(r"/\*.*?\*/", " ", src, flags=re.S)
          code = re.sub(r"//[^\n]*", " ", code)
          bad = [p for p in ("miniz", "mz_", "tdefl", "tinfl", "MZ_",
                             "SEXP", "Rf_", "Rinternals")
                 if p in code]
          for p in bad:
              print(f"FAIL inst/include/zukomp.h declares '{p}'")
          sys.exit(1 if bad else print("ok  no leaked vocabulary") or 0)
          PY
