# Holds .agents/assurance.md to the portfolio's assurance standard
# (.claude/shared/assurance.md): the file is well formed, every `done` is
# backed by a workflow, and every gap carries an issue. A tracked gap passes. It runs
# on every change, because the file it checks is Markdown the docs gate
# would skip.
on:
  pull_request:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "33 9 * * 0"
  workflow_dispatch:

name: assurance

permissions:
  contents: read

jobs:
  assurance:
    uses: pedrobtz/r-actions/.github/workflows/assurance.yml@v1
