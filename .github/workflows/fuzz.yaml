# Fuzzing the parsers.
#
# design 20 treats compressed input as attacker-controlled, so the decode
# paths get continuous coverage rather than only the examples the test suite
# happens to contain. Nothing here involves R: the targets link the pure-C
# core, which is why src/zu_internal.h must stay free of R.
#
# Whether a push or pull request runs these is r-actions' `changes` gate,
# the same one native-checks.yaml's jobs use, rather than a paths-ignore list
# of its own: prose and repository housekeeping (CRAN-SUBMISSION, .gitignore,
# other workflow files) skip it, and so does a pull request labelled
# `skip-ci:fuzz` or `ci:minimal`. Labels apply to pull requests only, so the
# push to main after merge still fuzzes.
on:
  push:
    branches: [main, master, develop]
  # `labeled`/`unlabeled` so that adding or removing a CI label reruns it.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

name: fuzz.yaml

permissions: read-all

# A new push to a pull request cancels the run it supersedes. Pushes to main
# (and scheduled runs) get a group of their own via run_id, so every merge is
# checked and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    uses: pedrobtz/r-actions/.github/workflows/changes.yml@v1
    with:
      name: fuzz
      # quick on a pull request, full on main, the schedule, a dispatch and
      # the `full-ci` label; the libFuzzer job reads it below.
      profile: auto

  fuzz:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    name: libFuzzer
    steps:
      - uses: actions/checkout@v6

      - name: seed the corpus from the committed fixtures
        # Starting from valid streams lets the fuzzer spend its budget
        # mutating structure it has already reached, instead of trying to
        # discover a valid gzip header by chance.
        run: ./tools/make-fuzz-corpus.sh

      - name: build the targets
        run: CC=clang ./fuzz/build.sh

      # 60 s per target as a smoke run; 900 s at the full profile, except on
      # the push to main after a merge, where ten-plus targets at 900 s
      # would add two and a half hours to every merge. So: nightly, a
      # dispatch, or a pull request labelled `full-ci`.
      - name: smoke run
        if: needs.changes.outputs.profile != 'full' || github.event_name == 'push'
        run: ./fuzz/run.sh 60

      - name: long run at the full profile
        if: needs.changes.outputs.profile == 'full' && github.event_name != 'push'
        run: ./fuzz/run.sh 900

      - name: keep any crasher for triage
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: |
            fuzz/build/crash-*
            fuzz/build/timeout-*
            fuzz/build/oom-*
            fuzz/build/*.log
          if-no-files-found: ignore

  msan:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    name: uninitialised reads (MSan)
    steps:
      - uses: actions/checkout@v6

      # Neither ASan nor UBSan detects an uninitialised read, which is why
      # the match-distance bug that patch 0002 fixes survived a whole v1
      # cycle of fuzzing: the decoder returned bytes from a never-written
      # malloc'd dictionary and every sanitizer in CI was blind to it.
      # MSan is the detector for that class, and it is Linux-and-real-clang
      # only -- Apple's clang rejects -fsanitize=memory outright.
      - name: build the replay drivers under MSan
        run: ./tools/make-fuzz-corpus.sh && CC=clang ./fuzz/build.sh --msan

      # This step is the reason to trust the next one. The canary reproduces
      # the bug's exact shape -- an unwritten malloc'd buffer, copied out,
      # then consumed -- and MUST fail. If it passes, either MSan is not
      # live or zu_fuzz_consume() has been optimised away, and the replay
      # below is checking nothing while still reporting success. That is the
      # same failure mode the sanitizer jobs in native-checks.yaml already
      # had once, where -fsanitize reached the environment echo and never a
      # compile line.
      - name: prove the detector is live
        run: |
          if ./fuzz/build-msan/msan_canary; then
            echo "::error::msan_canary did not report -- MSan is not detecting"
            echo "uninitialised reads, so the replay below proves nothing."
            exit 1
          fi
          echo "ok: the canary was caught, MSan is detecting"

      - name: replay the corpus under MSan
        run: ./fuzz/replay.sh fuzz/build-msan

  # Linux only. The macOS replay is tools/ci/platform.sh's, through
  # platforms.yaml, at the full profile: a second OS for a corpus this job
  # already replays on every pull request.
  replay:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    name: replay the regression corpus (ubuntu-latest)
    steps:
      - uses: actions/checkout@v6
      # Standalone ASan+UBSan drivers over the committed corpus, then the
      # ZIP reader against Python's zipfile: see the script.
      - name: replay, and compare the ZIP reader with Python's zipfile
        run: bash tools/ci/fuzz-replay.sh
