# Guards the public C ABI surface.
#
# design 8 requires inst/include/zukomp.h to compile standalone as C99
# against only <stddef.h> and <stdint.h>, mentioning neither R nor any
# vendored codec. That property is invisible to R CMD check -- the header is
# only ever compiled as part of a translation unit that already includes R
# headers -- so it is checked here instead.
#
# Whether a push or pull request runs these is r-actions' `changes` gate,
# the same one native-checks.yaml's jobs use, rather than a paths-ignore list
# of its own: prose and repository housekeeping skip it (testthat snapshots,
# Markdown under tests/, count as code), and so does a pull request labelled
# `skip-ci:abi` or `ci:minimal`. Labels apply to pull requests only, so
# the push to main after merge still runs it.
on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "18 9 * * 0"
  workflow_dispatch:
  pull_request:
    # `labeled`/`unlabeled` so that adding or removing a CI label reruns it.
    types: [opened, synchronize, reopened, labeled, unlabeled]

name: abi.yaml

permissions: read-all

# A new push to a pull request cancels the run it supersedes. Pushes to main
# (and scheduled runs) get a group of their own via run_id, so every merge is
# checked and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    uses: pedrobtz/r-actions/.github/workflows/changes.yml@v1
    with:
      name: abi

  # Linux only. The macOS leg is tools/ci/platform.sh's, through
  # platforms.yaml: one macOS job per pull request for everything zukomp
  # checks there, instead of one per workflow.
  standalone-header:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    name: zukomp.h standalone (ubuntu-latest)
    steps:
      - uses: actions/checkout@v6

      # The standalone-header probes need no R, but the two consumer probes
      # compile against R.h and so need $(R RHOME) to resolve.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # C99 and C++ with no R, a consumer against zukomp-r.h under -Werror,
      # the header inert when unused, and no leaked R or codec vocabulary.
      - name: compile the headers as a consumer does
        run: bash tools/ci/header-probes.sh
