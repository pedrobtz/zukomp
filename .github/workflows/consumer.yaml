# Stage 12: proves extensibility from outside zukomp.
#
# tests/consumer/zukomptest is a package that consumes zukomp the way zuhttp
# will -- Imports + LinkingTo, an importFrom in NAMESPACE, and a codec of its
# own registered through the published C ABI. It is .Rbuildignore'd, so
# nothing else builds it; this job is the only thing that does.
#
# The last step covers the second consumer shape: not a codec at all, but a C
# program linking inst/lib/libzukomp.a for the ZIP container reader.
#
# paths-ignore matches native-checks.yaml: these jobs compile the package and
# run code, so nothing they can observe lives in a .md file, a pkgdown article
# or .agents/. GitHub applies it only when *every* changed file matches, so a
# commit touching both prose and a source file still runs.
#
# `!tests/**` re-includes what `**.md` would otherwise swallow: testthat
# snapshots are .md files, and a commit that changes only a snapshot is
# exactly when the suite needs to run. Order matters -- the negation has to
# come after the pattern it undoes.
on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - '**.md'
      - '!tests/**'
      - 'vignettes/**'
      - '_pkgdown.yml'
      - '.agents/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '!tests/**'
      - 'vignettes/**'
      - '_pkgdown.yml'
      - '.agents/**'
      - 'docs/**'

name: consumer.yaml

permissions: read-all

jobs:
  consumer:
    runs-on: ${{ matrix.os }}
    name: external codec registration (${{ matrix.os }})
    # `R CMD INSTALL .` is a shell command line, not a PowerShell one: pwsh
    # parses CMD and INSTALL as arguments to R and fails before R runs.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check

      - name: install zukomp
        run: R CMD INSTALL .

      - name: install the consumer
        run: R CMD INSTALL tests/consumer/zukomptest

      # Via a file, not `Rscript -e`: on Windows only the first line of a
      # multi-line -e argument reaches R, which then halts on an incomplete
      # expression instead of running the tests.
      - name: run the consumer's tests
        run: |
          cat > run-consumer-tests.R <<'R'
          results <- as.data.frame(testthat::test_local(
              "tests/consumer/zukomptest", reporter = "summary"))
          # A zero-row result is a green job that proved nothing: any() over
          # an empty vector is FALSE. If test_local() discovers no files --
          # a rename, an .Rbuildignore change, a load failure -- that must
          # fail, not pass quietly.
          if (nrow(results) == 0L || sum(results$passed) == 0L) {
            stop("no consumer tests ran")
          }
          quit(status = as.integer(any(results$failed > 0 | results$error)))
          R
          Rscript run-consumer-tests.R

      # The other consumer shape: a C program that links inst/lib/libzukomp.a
      # for the ZIP reader, which zukomp.so deliberately does not contain.
      # Builds a real archive with zukomp's own codecs and reads it back.
      - name: link the static archive and read a ZIP
        run: ./tools/check-linking.sh
