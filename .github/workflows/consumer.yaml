# Stage 12: proves extensibility from outside zukomp.
#
# zukomp has two downstream consumption modes and a fixture package for each,
# both .Rbuildignore'd, so nothing else builds them; this workflow is the only
# thing that does.
#
#   tools/zukomptest  the table mode, as zuhttp will use it: Imports +
#                     LinkingTo, an importFrom in NAMESPACE, and a codec of
#                     its own registered through the published C ABI.
#   tools/zukomplink  the archive mode, as zuxlsx already uses it: LinkingTo
#                     alone, the installed libzukomp.a linked statically by
#                     the fixture's own ./configure, and zukomp's namespace
#                     never loaded. Driven by tools/check-linking.sh, which
#                     also audits the wiring the package itself cannot see.
#
# Whether a push or pull request runs these is r-actions' `changes` gate,
# the same one native-checks.yaml's jobs use, rather than a paths-ignore list
# of its own: prose and repository housekeeping skip it (testthat snapshots,
# Markdown under tests/, count as code), and so does a pull request labelled
# `skip-ci:consumer` or `ci:minimal`. Labels apply to pull requests only, so
# the push to main after merge still runs it.
#
# Linux only. The macOS and Windows legs of both jobs are
# tools/ci/platform.sh's, through platforms.yaml: one job per OS for
# everything zukomp checks there, instead of one per workflow and job. Both
# run the same tools/ci/consumer.sh and tools/ci/zuxlsx.sh as the jobs here.
on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "38 9 * * 0"
  workflow_dispatch:
  pull_request:
    # `labeled`/`unlabeled` so that adding or removing a CI label reruns it.
    types: [opened, synchronize, reopened, labeled, unlabeled]

name: consumer.yaml

permissions: read-all

# A new push to a pull request cancels the run it supersedes. Pushes to main
# (and scheduled runs) get a group of their own via run_id, so every merge is
# checked and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    uses: pedrobtz/r-actions/.github/workflows/changes.yml@v1
    with:
      name: consumer

  consumer:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    name: external codec registration (ubuntu-latest)
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check

      # Installs zukomp and tools/zukomptest and runs its tests (the table
      # mode), then tools/check-linking.sh (the archive mode): see the
      # script.
      - name: both consumption modes
        run: bash tools/ci/consumer.sh

      # The archive is rebuilt whenever the shared object is (#76): a
      # changed miniz.h reaches libzukomp.a under --preclean and in an
      # incremental in-tree build. Linux only; the make rules it tests are
      # the same on every platform, and two in-tree builds of the package
      # are minutes on the others.
      - name: rebuild the archive with the shared object
        run: ./tools/check-archive-fresh.sh

  # The real archive consumer, not a fixture of it (#35): zuxlsx@main built
  # against this checkout. Why, and how it keeps the zukomp under test from
  # being replaced, is in tools/ci/zuxlsx.sh.
  zuxlsx:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    name: zuxlsx builds against this zukomp (ubuntu-latest)
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::withr
          needs: check

      - name: zuxlsx@main against this zukomp
        run: bash tools/ci/zuxlsx.sh
