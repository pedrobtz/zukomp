on:
  push:
    branches: [main, master]
    paths-ignore:
      - ".github/badges/coverage.svg"
  pull_request:
  workflow_dispatch:

name: coverage.yaml

# The reusable workflow commits the rendered badge to .github/badges on push,
# so it needs write access to contents; a called workflow cannot request more
# than the caller grants. Pull requests still compute coverage and write the
# job summary, but skip the commit.
permissions:
  contents: write

jobs:
  coverage:
    # Pinned to a commit, not to @v1. This is the one job that runs with a
    # repository write token, and a tag is mutable: whoever can move v1 can
    # change what runs here. The deploy action in pkgdown.yaml is pinned for
    # the same reason. Update deliberately, with the tag it corresponds to.
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@52ac4a70580e9261bfedc41314101615ade407f8 # v1.6.2
    permissions:
      contents: write
