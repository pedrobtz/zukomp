# Native-code checks, from the shared reusable workflows.
#
# These replace a hand-rolled memcheck.yaml. Two of them -- lto and
# gctorture -- were not in it and are worth more here than what they
# replaced: LTO catches type mismatches between translation units, which
# matters for a package whose C ABI is split across a dozen files plus a
# vendored library; and gctorture is a far better test of PROTECT discipline
# than rchk alone, since it provokes real collections instead of reasoning
# about them statically.
on:
  push:
    branches: [main, master, develop]
  pull_request:
  schedule:
    - cron: "23 4 * * *"

name: native-checks

permissions: read-all

jobs:
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@v1

  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1

  # Not a duplicate of the shared sanitizers job, and here for two reasons
  # that job cannot cover from a generic template:
  #
  #  1. The shared workflow takes no inputs, so ZUKOMP_SLOW_TESTS cannot be
  #     passed into it, and without that only the sampled CRAN subset of the
  #     truncation and corruption sweeps runs. For this package those sweeps
  #     are precisely where a memory-safety bug would live.
  #  2. It halts on a UBSan finding rather than only printing one:
  #     UBSAN_OPTIONS=halt_on_error=1 plus -fno-sanitize-recover=undefined, so
  #     the exit status is meaningful. Both bugs found by fuzzing in Stage 14
  #     were UBSan findings, and a job that prints them and stays green is a
  #     job that would have missed both.
  #
  # If the shared workflow ever accepts an env passthrough and halts on
  # UBSan, delete this job.
  sanitizers-exhaustive:
    runs-on: ubuntu-latest
    name: ASan + UBSan over the exhaustive sweeps
    # Every step below pipes into tee. Without pipefail the step's exit
    # status is tee's, always 0, so a failed install or a failing test suite
    # would leave the job green -- which is the failure mode this job exists
    # to avoid in the first place.
    defaults:
      run:
        shell: bash
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_init_order=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      ZUKOMP_SLOW_TESTS: "true"
    steps:
      - uses: actions/checkout@v6

      - run: sudo apt-get update && sudo apt-get install -y clang

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::withr
          needs: check

      # Via ~/.R/Makevars, NOT environment variables. R's etc/Makeconf
      # assigns CFLAGS with `=`, and make prefers a makefile assignment over
      # the environment, so `CFLAGS=... R CMD INSTALL` silently builds
      # uninstrumented -- a sanitizer job that cannot fail. Verified with a
      # sentinel -D: absent via the environment, present via this file.
      - name: point the build at the sanitizers
        run: |
          mkdir -p ~/.R
          cat >> ~/.R/Makevars <<'MK'
          CC = clang
          CXX = clang++
          CFLAGS = -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined
          CXXFLAGS = -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined
          MK

      - name: confirm the build really is instrumented
        # Cheap insurance against this job going quietly green again.
        run: |
          R CMD INSTALL --preclean . 2>&1 | tee install.log
          grep -q -- "-fsanitize=address" install.log \
            || { echo "FAIL build is not instrumented"; exit 1; }
          echo "ok  sanitizer flags reached the compiler"

      - name: run the full suite, exhaustive sweeps included
        run: |
          Rscript -e 'setwd("tests"); source("testthat.R")' 2>&1 | tee san.log
          # -fno-sanitize-recover makes UBSan abort, so the exit code is
          # meaningful; LeakSanitizer still only prints, hence the grep.
          if grep -Eq "runtime error|AddressSanitizer|LeakSanitizer|SUMMARY: .*Sanitizer" san.log; then
            echo "FAIL sanitizer findings above"
            exit 1
          fi
          echo "ok  clean under ASan and UBSan"
