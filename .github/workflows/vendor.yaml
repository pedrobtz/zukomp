# Guards the vendored sources under src/vendor/.
#
# The guard itself now lives in pedrobtz/r-actions -- it is generic, and the
# rule it enforces is mechanical: the tree must match tools/vendor/manifest.tsv,
# and a pull request touching src/vendor/ must update the manifest and the
# checksums alongside. Together they make an unrecorded change to third-party
# code a CI failure rather than something a reviewer has to catch by eye.
#
# Its defaults are this package's layout, so there is nothing to configure.
#
# r-actions calls track `@v1`, except coverage.yml: it is the one call that
# holds a repository write token, and a tag is mutable, so it stays pinned to a
# commit with the tag in a trailing comment and is bumped deliberately, reading
# the diff. The read-only calls follow v1 so that its fixes reach every family
# repo without a pull request in each.
# The interop job below stays here: it needs real external decoders, which is
# specific to what zukomp produces rather than to vendoring.
on:
  push:
    branches: [main, master, develop]
  pull_request:

name: vendor.yaml

permissions: read-all

# A new push to a pull request cancels the run it supersedes. Pushes to main
# (and scheduled runs) get a group of their own via run_id, so every merge is
# checked and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  vendor:
    uses: pedrobtz/r-actions/.github/workflows/vendor.yml@v1

  interop:
    runs-on: ubuntu-latest
    name: external decoders accept zukomp output
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
          needs: check
      # The committed fixtures cover external encoders -> zukomp under
      # R CMD check. This is the other direction, which needs real tools
      # that CRAN does not guarantee.
      - name: tools/check-interop.sh
        run: ./tools/check-interop.sh
