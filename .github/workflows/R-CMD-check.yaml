# R CMD check, on the GitHub runners and in the CRAN-like containers, from the
# shared reusable workflow in pedrobtz/r-actions.
#
# Every r-actions call here is pinned to a commit, with the tag in a trailing
# comment. A tag is mutable, so `@v1` means "whatever it points at when the job
# starts" -- v1 moved eleven commits under this repo between two CI runs. Bump
# the pins deliberately, reading the diff.
#
# This replaces a hand-rolled 3 x 3 {OS x R version} matrix. It does not
# reproduce that matrix through the workflow's `runners` input; it takes the
# default four legs plus Windows R-devel (see the job comment below). The trade
# is deliberate: nine runner legs become five, and in exchange
# the check finally reaches the two r-devel Linux flavors CRAN actually uses.
#
# Those differ from every GitHub runner in the *compiler* -- clang 23 building
# C as -std=gnu23, and GCC 16 -- which ubuntu-latest has neither of. That gap
# is not academic for this package: zukomp compiles vendored miniz, written
# against the compilers miniz tests on, and `-pedantic` (which CRAN passes and
# no runner does) is what enables several diagnostics that would otherwise
# arrive as a rejected submission rather than a red check. The workflow's
# `container-makevars` default is what closes it.
#
# What the dropped rows were buying is smaller than it looks. The old
# ubuntu/devel row pinned R-devel to the runner's own GCC, which matches no
# CRAN flavor and is strictly worse than the containers now covering it. The
# macOS devel and the macOS and Windows oldrel-1 rows were real coverage (the
# Windows devel row has since come back, for win-builder parity), but this
# package's compiled surface is plain C99 against a vendored library, and the
# toolchain axis -- which is where its risk actually lives -- is now covered
# far better than nine same-compiler cells ever did. Add rows back through
# `runners` if an R-version-specific failure ever shows up.
on:
  push:
    branches: [main, master, develop]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

# A new push to a pull request cancels the run it supersedes. Pushes to main
# (and scheduled runs) get a group of their own via run_id, so every merge is
# checked and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # `runners` is the workflow's default four legs (macOS, Windows and Ubuntu on
  # release, plus Ubuntu oldrel-1) with one added: Windows on R-devel. Without
  # it, Windows was checked only on release and R-devel only on Linux, so the
  # combination CRAN's win-builder devel check runs was reached by nothing
  # here. With it, that leg stands in for win-builder devel before a
  # submission. Everything else is at its default, including the three
  # CRAN-like containers -- clang23, ubuntu-clang and ubuntu-gcc16 -- compiling
  # with CRAN's own `CC += -std=gnu23` and `CFLAGS += -pedantic`.
  #
  # build-args is a default too. The old file passed
  # --compact-vignettes=gs+qpdf, which has had nothing to compact since
  # vignettes/articles went into .Rbuildignore: no vignette ships in the
  # tarball, and the articles are built by pkgdown.yaml instead.
  R-CMD-check:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@4d0a0829594aafcc807ca167aecb8f107b193b33 # v1.12.0
    with:
      runners: >-
        [{"os": "macos-latest", "r": "release"},
         {"os": "windows-latest", "r": "release"},
         {"os": "windows-latest", "r": "devel"},
         {"os": "ubuntu-latest", "r": "release"},
         {"os": "ubuntu-latest", "r": "oldrel-1"}]
