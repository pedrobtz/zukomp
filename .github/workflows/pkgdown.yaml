# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, develop]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # pkgdown renders every top-level .md file except a fixed list (README,
      # NEWS, LICENSE, cran-comments), with no setting to exclude more, and
      # .Rbuildignore does not reach it. CLAUDE.md (agent instructions) was
      # therefore a public page on the site. The checkout is throwaway, so
      # moving it aside is the whole fix -- and it also keeps it out of the
      # sitemap, search index and llms.txt. Any other top-level .md that is
      # not meant for the site belongs on this line too.
      - name: Keep repository-internal notes off the site
        run: mv CLAUDE.md "$RUNNER_TEMP"/

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # develop builds the site to prove the articles still knit -- it is the
      # only thing that runs them, since vignettes/articles is .Rbuildignore'd
      # and R CMD check never sees it -- but only main publishes.
      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/develop'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        # clean: true removes pages the site no longer generates -- without it
        # a page, once published, stayed forever, which is how CLAUDE.html
        # and review.html outlived the files they were built from.
        # clean-exclude is what keeps the coverage badge, which coverage.yaml
        # commits to badges/ on this same branch and pkgdown never generates. force: false makes the
        # deploy rebase instead of force-pushing: both workflows run on every
        # push to main, and a badge commit landing between this action's
        # checkout and its push would otherwise be overwritten without a
        # trace. The badge job already retries when the deploy wins the race
        # the other way.
        with:
          force: false
          clean: true
          clean-exclude: |
            badges
          branch: gh-pages
          folder: docs
